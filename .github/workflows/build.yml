name: Build installers

# Baut die Tester-Installer für Windows, macOS (Universal: Intel + Apple Silicon)
# und Linux in der Cloud. Auslösbar manuell (workflow_dispatch) oder per Versions-Tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write          # für das automatische Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS/Linux vorerst deaktiviert: window_vibrancy (main.rs:176,
          # NSVisualEffectMaterial = macOS-spezifisch) ist nicht cross-platform
          # cfg-gated → Compile-Fehler dort. Tester sind auf Windows; macOS/Linux
          # später nach einem cfg(target_os="macos")-Fix wieder aufnehmen.
          - platform: windows-latest
            rust_targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Nur Linux: System-Abhängigkeiten für Tauri (WebKitGTK etc.)
      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Frontend-Deps installieren
        run: npm ci

      # Vite liest VITE_*-Variablen aus .env im Projekt-Root zur Build-Zeit und
      # backt sie ins Bundle. Wir schreiben sie hier aus GitHub-Secrets (über die
      # Step-env, nicht direkt interpoliert — sicher gegen Sonderzeichen/Injection).
      - name: .env für Vite schreiben (Supabase + Webhook)
        shell: bash
        env:
          VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:   ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LEAD_WEBHOOK_SECRET: ${{ secrets.VITE_LEAD_WEBHOOK_SECRET }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_LEAD_WEBHOOK_SECRET=$VITE_LEAD_WEBHOOK_SECRET"
          } > .env

      - name: Tauri bauen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Voll-Cloud-Build: eingebetteter Anthropic-Key (KORA) zur Compile-Zeit für
          # Rust option_env!(); Supabase/Webhook kommen via .env (Schritt oben) ins
          # Vite-Bundle. Kein VITE_LOCAL_MODE → Login-Screen erscheint (mit „überspringen").
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          args: ${{ matrix.args }}
          # Legt automatisch ein (Entwurfs-)Release mit den Installern als Assets an.
          tagName: app-v__VERSION__
          releaseName: 'Cultera Focus v__VERSION__'
          releaseDraft: true
          prerelease: false
